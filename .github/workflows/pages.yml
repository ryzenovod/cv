name: Sync static site to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-sync"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync site files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            ./ /tmp/gh-pages/

          cd /tmp/gh-pages
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "No site changes to publish"
            exit 0
          fi

          git commit -m "deploy: publish portfolio"
          git push origin HEAD:gh-pages
