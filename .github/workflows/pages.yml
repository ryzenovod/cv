name: Portfolio quality and deploy

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "portfolio-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid

      - name: Run responsive layout checks
        run: npm run test:layout

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-layout-${{ github.sha }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync verified static files to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.js' \
            --exclude='tests' \
            --exclude='artifacts' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            ./ /tmp/gh-pages/

          GITHUB_SHA="$GITHUB_SHA" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          page = Path('/tmp/gh-pages/index.html')
          html = page.read_text(encoding='utf-8')
          version = os.environ['GITHUB_SHA'][:12]

          html = re.sub(r'href="app\.css(?:\?v=[^"]*)?"', f'href="app.css?v={version}"', html)
          html = re.sub(r'src="app\.js(?:\?v=[^"]*)?"', f'src="app.js?v={version}"', html)
          page.write_text(html, encoding='utf-8')
          PY

          cd /tmp/gh-pages
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "No site changes to publish"
            exit 0
          fi

          git commit -m "deploy: publish verified portfolio ${GITHUB_SHA:0:12}"
          git push origin HEAD:gh-pages
