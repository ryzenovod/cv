name: Apply desktop poster sizing patch

on:
  push:
    branches: ["refactor/portfolio-v3"]
    paths:
      - ".github/workflows/patch-poster.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/portfolio-v3
          fetch-depth: 0
      - name: Patch desktop collage sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.css')
          css = path.read_text(encoding='utf-8')
          replacements = {
              ".hero-visual{grid-template-columns:minmax(0,1fr) minmax(0,.56fr)}": ".hero-visual{grid-template-columns:minmax(0,.95fr) minmax(0,.65fr)}",
              ".hero-poster{min-height:445px;padding:24px}": ".hero-poster{min-height:445px;padding:20px}",
              ".poster-title{font-size:clamp(31px,3.2vw,52px)}": ".poster-title{font-size:clamp(27px,2.4vw,36px);overflow-wrap:normal;word-break:normal}"
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'Missing expected CSS fragment: {old}')
              css = css.replace(old, new, 1)
          path.write_text(css, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css
          git commit -m "fix: balance desktop poster typography"
          git push origin HEAD:refactor/portfolio-v3
